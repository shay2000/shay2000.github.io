<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b3d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff6b3d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f4f1ec" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0c0b0a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1080" cy="90" r="420" fill="url(#glow)"/>

  <!-- wordmark -->
  <text x="80" y="96"
        font-family="'SF Mono', Menlo, Consolas, monospace"
        font-size="26" font-weight="600" letter-spacing="-0.5">
    <tspan fill="#ff6b3d">~</tspan><tspan fill="#57504a">/</tspan><tspan fill="#f4f1ec">shay2000</tspan>
  </text>
  <rect x="80" y="118" width="120" height="3" rx="1.5" fill="#ff6b3d"/>

  <!-- headline -->
  <text x="80" y="270"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="74" font-weight="500" fill="#f4f1ec" letter-spacing="-2">
    Small tools that fix
  </text>
  <text x="80" y="356"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="74" font-weight="500" font-style="italic" fill="#ff6b3d" letter-spacing="-2">
    specific
  </text>
  <text x="404" y="356"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="74" font-weight="500" fill="#f4f1ec" letter-spacing="-2">
    annoyances.
  </text>

  <!-- sub -->
  <text x="80" y="424"
        font-family="'SF Mono', Menlo, Consolas, monospace"
        font-size="21" fill="#b6ada1">
    macOS menu-bar utilities · self-hosted services · research tooling
  </text>

  <!-- rule -->
  <line x1="80" y1="486" x2="1120" y2="486" stroke="#f4f1ec" stroke-opacity="0.14" stroke-width="1"/>

  <!-- stats -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="19">
    <text x="80" y="540" fill="#7d7468" font-size="14" letter-spacing="2">REPOS</text>
    <text x="80" y="574" fill="#f4f1ec" font-size="30" font-weight="600">13</text>

    <text x="260" y="540" fill="#7d7468" font-size="14" letter-spacing="2">LANGUAGES</text>
    <text x="260" y="574" fill="#f4f1ec" font-size="30" font-weight="600">26</text>

    <text x="470" y="540" fill="#7d7468" font-size="14" letter-spacing="2">COMMITS SAMPLED</text>
    <text x="470" y="574" fill="#f4f1ec" font-size="30" font-weight="600">660</text>

    <text x="740" y="540" fill="#7d7468" font-size="14" letter-spacing="2">SINCE</text>
    <text x="740" y="574" fill="#f4f1ec" font-size="30" font-weight="600">2014</text>
  </g>

  <text x="1120" y="574" text-anchor="end"
        font-family="'SF Mono', Menlo, Consolas, monospace"
        font-size="19" fill="#ff6b3d">github.com/shay2000</text>
</svg>
